<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <!-- Minimal redesign: mobile browser chrome matches the warm canvas (#f8f5f0). -->
    <meta name="theme-color" content="#f8f5f0" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <script>
      (function () {
        try {
          var stored = localStorage.getItem('utilityflow-theme');
          var mode = stored === 'light' || stored === 'dark' || stored === 'system' ? stored : 'system';
          var prefersDark = window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches;
          var resolved = mode === 'system' ? (prefersDark ? 'dark' : 'light') : mode;
          var root = document.documentElement;
          root.classList.toggle('dark', resolved === 'dark');
          root.style.colorScheme = resolved;
          root.dataset.themeMode = mode;
        } catch (e) {}
      })();
    </script>
    <title>UtilityFlow – Fast Browser-Based Online Utility Tools</title>
    <meta
      name="description"
      content="Free, fast, privacy-first online utility tools for text analysis, developer formatting, calculators, PDFs, SEO checks, and image workflows."
    />
    <link rel="canonical" href="https://utilityflow.online/" />
    <meta property="og:title" content="UtilityFlow – Fast Browser-Based Online Utility Tools" />
    <meta
      property="og:description"
      content="Free, fast, privacy-first online utility tools for text analysis, developer formatting, calculators, PDFs, SEO checks, and image workflows."
    />
    <meta property="og:type" content="website" />
    <meta property="og:url" content="https://utilityflow.online/" />
    <meta property="og:site_name" content="UtilityFlow" />
    <meta property="og:locale" content="en_US" />
    <meta property="og:image" content="https://utilityflow.online/og-image.jpg" />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="UtilityFlow – Fast Browser-Based Online Utility Tools" />
    <meta
      name="twitter:description"
      content="Free, fast, privacy-first online utility tools for text analysis, developer formatting, calculators, PDFs, SEO checks, and image workflows."
    />
    <meta name="twitter:image" content="https://utilityflow.online/og-image.jpg" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      id="utilityflow-fonts"
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Great+Vibes&family=JetBrains+Mono:wght@400;500;600&display=swap"
      rel="stylesheet"
      media="print"
    />
    <!-- M-7: load Google Fonts without render-blocking. The stylesheet
         above starts as media="print" (fetched in parallel by the preload
         scanner, NOT render-blocking); this inline script swaps it to
         media="all" as soon as it is ready. No inline onload attribute is
         used because CSP script-src has no 'unsafe-inline'. Do NOT move
         this script (its CSP sha256 hash lives in public/_headers). -->
    <script>
      (function () {
        var link = document.getElementById('utilityflow-fonts');
        if (!link) return;
        var apply = function () { link.media = 'all'; };
        if (link.sheet) { apply(); } else { link.addEventListener('load', apply); }
        window.addEventListener('load', apply);
      })();
    </script>
    <!-- Google Analytics 4 (Audit Fix #6) — Measurement ID G-EEF32XG70M.
         H-3: gtag.js itself is deferred (loaded from main.tsx after first
         paint via requestIdleCallback); only this inline config stub stays
         in <head>. It queues calls in dataLayer until gtag.js arrives, so
         the config/page_view still fires. Do NOT move this stub (its CSP
         sha256 hash lives in public/_headers). -->
    <script>
      window.dataLayer = window.dataLayer || [];
      function gtag(){dataLayer.push(arguments);}
      gtag('js', new Date());
      gtag('consent', 'default', {ad_storage: 'denied', analytics_storage: 'denied', ad_user_data: 'denied', ad_personalization: 'denied'});
      try {
        if (localStorage.getItem('uf-consent') === 'granted') {
          gtag('consent', 'update', {ad_storage: 'granted', analytics_storage: 'granted', ad_user_data: 'granted', ad_personalization: 'granted'});
        }
      } catch (e) {}
      gtag('config', 'G-EEF32XG70M');
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
